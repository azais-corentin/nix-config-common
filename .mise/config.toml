[task_config]
# Shared tasks live in tooling/ (consumers link it as .tooling); local tasks
# come last so a same-named local task wins.
includes = ["tooling/tasks", ".mise/tasks"]

[tasks."check:nix"]
description = "Evaluate this flake without building or validating consumer configurations"
run = "nix flake check --no-build --no-write-lock-file"

[tools]
# hk matches the hk@2.0.1 Pkl package amended by tooling/hk/base.pkl.
# gitleaks comes from the dev shell (flake.lock).
hk = "2.0.1"
bun = "latest"
pkl = "latest"

[hooks]
postinstall = "hk install --mise"
